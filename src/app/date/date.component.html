<div class="row g-5">
  <div class="col-md-6">
    <section class="date-section p-3 py-5 h-100" id="date-section">
      <div class="header-seciton text-center">
        <h2 class="section-title">SAVE THE DATE</h2>
        <h4 class="sub-title">Counting Down</h4>
      </div>

      <div class="row g-4 mt-md-5">
        <div class="col-6">
          <div class="count-card">
            <h3>{{ formatNumber(time.days) }}</h3>
            <span>Days</span>
          </div>
        </div>

        <div class="col-6">
          <div class="count-card">
            <h3>{{ formatNumber(time.hours) }}</h3>
            <span>Hours</span>
          </div>
        </div>

        <div class="col-6">
          <div class="count-card">
            <h3>{{ formatNumber(time.minutes) }}</h3>
            <span>Minutes</span>
          </div>
        </div>

        <div class="col-6">
          <div class="count-card">
            <h3>{{ formatNumber(time.seconds) }}</h3>
            <span>Seconds</span>
          </div>
        </div>

      </div>

    </section>
  </div>

  <div class="col-md-6">
    <section class="date-cards d-flex flex-column gap-3 p-3 py-5 h-100" id="date-cards">
      <div class="card text-center p-3">

        <div class="card-icon text-center m-auto">
          <i class="fa-regular fa-calendar fs-4"></i>
        </div>

        <div class="card-content mt-3">
          <h4 class="m-0 main-color fw-semibold">DATE</h4>
          <p class="m-0">SEPTEMBER 10, 2026</p>
          <span class="m-0">Thursday</span>
        </div>
      </div>

      <div class="card text-center p-3">
        <div class="card-icon text-center m-auto">
          <i class="fa-regular fa-clock fs-4"></i>
        </div>

        <div class="card-content mt-3">
          <h4 class="m-0 main-color fw-semibold" >TIME</h4>
          <p class="m-0">6:00 PM</p>
          <span class="m-0">Reseption to follow</span>
        </div>
      </div>

      <div class="card text-center p-3">

        <div class="card-icon text-center m-auto">
          <i class="fa-solid fa-location-dot fs-4"></i>
        </div>

        <div class="card-content mt-3">
          <h4 class="m-0 main-color fw-semibold">VENUM</h4>
          <p class="m-0">LAMURE VIP Hall</p>
          <span class="m-0">Giza, Egypt</span>
        </div>
      </div>

    </section>
  </div>
</div>
